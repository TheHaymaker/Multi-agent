[project]
name = "overnight-eng"
version = "0.1.0"
description = "A local-first multi-agent 'overnight engineering' system: triages Sentry/Grafana, polls Jira, coordinates PRs, and proposes quality/test/perf/type improvements while you sleep."
requires-python = ">=3.11,<3.14"
dependencies = [
    # Agent orchestration spine (open-source, model-agnostic — mirrors the Dev Signal stack)
    "google-adk>=1.0.0",
    "litellm>=1.50.0",            # ADK -> Claude via LiteLlm (API-key glue)
    "mcp>=1.0.0",                 # Model Context Protocol client
    # Long-term memory + vector store
    "mem0ai>=0.1.0",
    # Web/scheduler surface
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "apscheduler>=3.10.0",
    # Storage drivers
    "psycopg[binary]>=3.1.0",     # Postgres session/state
    "redis>=5.0.0",               # event queue
    # Observability
    "langfuse>=2.0.0",
    "opentelemetry-sdk>=1.20.0",
    # Code-surgery worker (subscription-backed agentic edits)
    "claude-agent-sdk>=0.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
overnight = "overnight_eng.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["overnight_eng"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
